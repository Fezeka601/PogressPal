services:
  db:
    image: postgres:16
    container_name: progresspal-db
    environment:
      POSTGRES_DB: progresspal
      POSTGRES_USER: progresspal_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}
    ports:
      - "5432:5432"
    volumes:
      - progresspal_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U progresspal_user -d progresspal"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: progresspal-backend
    container_name: progresspal-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/progresspal
      DB_USERNAME: progresspal_user
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}
    ports:
      - "8080:8080"

volumes:
  progresspal_data: